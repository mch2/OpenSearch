%YAML 1.2
---
# Override list for DataFusion's substrait function vocabulary.
#
# The full set of function names DF's substrait consumer accepts is:
#   1. Substrait spec functions DF's consumer maps to its own (add, subtract, sin,
#      cos, lt, equal, ...). We get these for free by loading substrait core's
#      YAMLs — no entries here needed.
#   2. Names DF only recognises via direct match against its function registry —
#      either DF built-ins whose name differs from the substrait spec (signum vs
#      sign, trunc vs truncate, random vs rand) or UDFs we registered ourselves
#      (expm1, rint, conv, e, cbrt, pi, etc.).
#
# This file declares (2). Each entry's name is the function name DF will see in
# the substrait plan and resolve via its registry; the impls list the operand /
# return types DF actually accepts. Calcite-name → name-here mapping lives in
# the `calcite_aliases` block below, loaded by NameBasedScalarFunctionConverter
# for the few cases where Calcite's operator name differs (e.g. SIGN → signum,
# TRUNCATE → trunc).
urn: extension:org.opensearch:opensearch_scalar

# Calcite operator name (lowercased) → name DataFusion's substrait consumer accepts.
# Two purposes:
#  1. Operator symbols. Calcite's getName() for arithmetic and comparison is the literal symbol;
#     substrait spec uses words and DF's consumer maps them to its operators.
#  2. Calcite-name → DF-name overrides. A few functions where Calcite emits one name (SIGN,
#     TRUNCATE, RAND, LOG, ILIKE, MOD) but DF's consumer recognises a different one — either a
#     substrait spec name (logb) or a name registered via this YAML (signum, trunc, random).
#
# substrait-java's parser ignores this block (ExtensionSignatures has @JsonIgnoreProperties).
calcite_aliases:
  # Operator symbols → substrait spec words
  "+": add
  "-": subtract
  "*": multiply
  "/": divide
  "%": modulus
  "=": equal
  "<>": not_equal
  "!=": not_equal
  "<": lt
  "<=": lte
  ">": gt
  ">=": gte

  # Calcite name → name DF's substrait consumer recognises
  mod: modulus
  character_length: char_length
  length: char_length
  len: char_length
  ilike: like
  log: logb
  sign: signum
  truncate: trunc
  rand: random

  # Crypto aliases — PPL emits md5/sha1/sha2/sha256 but DF's built-ins return
  # different bytes than expected. Route to our Rust UDF wrappers (ppl_*) which
  # do standard hashing of the UTF-8 bytes.
  md5: ppl_md5
  sha1: ppl_sha1
  sha2: ppl_sha2
  sha256: ppl_sha256

  # Aggregate aliases — PPL operator name → DF built-in name
  first: first_value
  last: last_value
  dc: count
  distinct_count: count
  percentile: approx_percentile_cont

  # Multi-value aliases — PPL operator name → DF array_* built-in
  mvcount: array_length
  mvjoin: array_to_string
  mvindex: array_element
  mvappend: array_concat
  mvdedup: array_distinct
  split: string_to_array

  # Date/time aliases — PPL operator name → DF built-in name
  sysdate: now
  date_format: to_char
  str_to_date: to_timestamp
  strftime: to_char
  strptime: to_timestamp
  time_format: to_char
  date: to_date
  time: to_time
  datetime: to_timestamp
  makedate: make_date
  maketime: make_time
  unix_timestamp: to_unixtime
  extract: date_part

scalar_functions:
  # ── Integer variants for substrait-core fp-only math functions ──
  # Substrait core declares sin/cos/tan/etc. only on fp32/fp64. DataFusion
  # handles integer inputs fine (its own planner inserts implicit casts), but
  # isthmus needs a matching variant to emit the substrait call. Adding i64
  # variants here lets isthmus resolve the call; DF coerces internally.
  -
    name: "sin"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "cos"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "tan"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "asin"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "acos"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "atan"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "exp"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "sqrt"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "ln"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "log2"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "log10"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "logb"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "degrees"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "radians"
    impls:
      - args: [{ value: i64, name: "x" }]
        return: fp64

  # ── Custom UDFs (not in substrait core) ──
  -
    name: "cbrt"
    description: "Cube root."
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "trunc"
    description: "Truncate toward zero."
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: fp64, name: "x" }, { value: i32, name: "digits" }]
        return: fp64
  -
    name: "pi"
    impls:
      - args: []
        return: fp64
  -
    name: "random"
    impls:
      - args: []
        return: fp64
  -
    name: "signum"
    description: "Sign of value (-1, 0, +1). DataFusion calls this signum, not sign."
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: i64
  -
    name: "cosh"
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "sinh"
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "cot"
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "e"
    impls:
      - args: []
        return: fp64
  -
    name: "expm1"
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "rint"
    impls:
      - args: [{ value: fp64, name: "x" }]
        return: fp64
      - args: [{ value: i64, name: "x" }]
        return: fp64
  -
    name: "crc32"
    impls:
      - args: [{ value: string, name: "value" }]
        return: i64
  -
    name: "conv"
    impls:
      - args: [{ value: i64, name: "value" }, { value: i64, name: "from_base" }, { value: i64, name: "to_base" }]
        return: string
  # ── Date/time functions (DF built-ins not in substrait core) ──
  -
    name: "now"
    impls:
      - args: []
        return: "timestamp"
  -
    name: "current_date"
    impls:
      - args: []
        return: "date"
  -
    name: "current_time"
    impls:
      - args: []
        return: "time"
  -
    name: "current_timestamp"
    impls:
      - args: []
        return: "timestamp"
  -
    name: "from_unixtime"
    impls:
      - args: [{ value: i64, name: "unixtime" }]
        return: "timestamp"
  -
    name: "to_unixtime"
    impls:
      - args: [{ value: "any1", name: "ts" }]
        return: i64
  -
    name: "make_date"
    impls:
      - args: [{ value: i32, name: "year" }, { value: i32, name: "month" }, { value: i32, name: "day" }]
        return: "date"
  -
    name: "make_time"
    impls:
      - args: [{ value: i32, name: "hour" }, { value: i32, name: "minute" }, { value: fp64, name: "second" }]
        return: "time"
  -
    name: "to_date"
    impls:
      - args: [{ value: "any1", name: "value" }]
        return: "date"
  -
    name: "to_time"
    impls:
      - args: [{ value: "any1", name: "value" }]
        return: "time"
  -
    name: "to_timestamp"
    impls:
      - args: [{ value: "any1", name: "value" }]
        return: "any1"
      - args: [{ value: "any1", name: "value" }, { value: string, name: "format" }]
        return: "any1"
  -
    name: "to_char"
    impls:
      - args: [{ value: "any1", name: "value" }, { value: string, name: "format" }]
        return: string
  -
    name: "date_part"
    impls:
      - args: [{ value: string, name: "part" }, { value: "any1", name: "value" }]
        return: fp64

  # ── Conditional ──
  -
    name: "coalesce"
    impls:
      - args: [{ value: "any1", name: "a" }, { value: "any1", name: "b" }]
        return: "any1"
      - args: [{ value: "any1", name: "a" }, { value: "any1", name: "b" }, { value: "any1", name: "c" }]
        return: "any1"
      - args: [{ value: "any1", name: "a" }, { value: "any1", name: "b" }, { value: "any1", name: "c" }, { value: "any1", name: "d" }]
        return: "any1"

  # ── String functions (DF built-ins / DF-flavor) ──
  # concat — substrait spec declares concat as variadic, but isthmus's
  # matcher needs explicit arity variants for nullable string inputs.
  -
    name: "concat"
    impls:
      - args: [{ value: string, name: "a" }, { value: string, name: "b" }]
        return: string
      - args: [{ value: string, name: "a" }, { value: string, name: "b" }, { value: string, name: "c" }]
        return: string
      - args: [{ value: string, name: "a" }, { value: string, name: "b" }, { value: string, name: "c" }, { value: string, name: "d" }]
        return: string
  -
    name: "concat_ws"
    impls:
      - args: [{ value: string, name: "sep" }, { value: string, name: "a" }, { value: string, name: "b" }]
        return: string
      - args: [{ value: string, name: "sep" }, { value: string, name: "a" }, { value: string, name: "b" }, { value: string, name: "c" }]
        return: string
      - args: [{ value: string, name: "sep" }, { value: string, name: "a" }, { value: string, name: "b" }, { value: string, name: "c" }, { value: string, name: "d" }]
        return: string
  -
    name: "ascii"
    impls:
      - args: [{ value: string, name: "value" }]
        return: i64
  -
    name: "ltrim"
    impls:
      - args: [{ value: string, name: "value" }]
        return: string
  -
    name: "rtrim"
    impls:
      - args: [{ value: string, name: "value" }]
        return: string

  # ── Crypto / hash UDFs (registered by analytics-backend-datafusion rust/udf/mod.rs) ──
  # Names prefixed ppl_* to override DF's built-in md5/sha1/sha2/sha256, which compute
  # different hashes than standard MD5/SHA over the UTF-8 bytes.
  -
    name: "ppl_md5"
    impls:
      - args: [{ value: string, name: "value" }]
        return: string
  -
    name: "ppl_sha1"
    impls:
      - args: [{ value: string, name: "value" }]
        return: string
  -
    name: "ppl_sha2"
    impls:
      - args: [{ value: string, name: "value" }, { value: i32, name: "bits" }]
        return: string
  -
    name: "ppl_sha256"
    impls:
      - args: [{ value: string, name: "value" }]
        return: string

  # ── IP UDFs ──
  -
    name: "cidrmatch"
    impls:
      - args: [{ value: string, name: "cidr" }, { value: string, name: "ip" }]
        return: boolean

  # ── JSON UDFs ──
  -
    name: "json_valid"
    impls:
      - args: [{ value: string, name: "value" }]
        return: boolean
  -
    name: "json_object"
    impls:
      - args: [{ value: string, name: "k1" }, { value: string, name: "v1" }]
        return: string
      - args: [{ value: string, name: "k1" }, { value: string, name: "v1" }, { value: string, name: "k2" }, { value: string, name: "v2" }]
        return: string
