%YAML 1.2
---
# Substrait extension declaring the struct-field accessor.
#
# This file exists ONLY to give the function an extension anchor (URN + name) that the consumer
# resolves by name. The argument list is attached by GetFieldCallConverter, which builds the
# Expression.ScalarFunctionInvocation directly and therefore never goes through isthmus' signature
# matcher.
#
# WHY THE MATCHER IS BYPASSED:
# isthmus derives one type that every operand must satisfy. get_field's operands are a struct and a
# field name, and the struct's type is the object's ROW type — data-dependent, so no declaration
# could name it. The output type comes from the Calcite call, which the planner typed from the index
# mapping; the declared return type below is not consulted.
urn: extension:org.opensearch:struct_functions
scalar_functions:
  - name: get_field
    description: >-
      Read one field of a struct by name: get_field(struct, 'name'). Anchor declaration only — see
      the header. The real arguments are attached by GetFieldCallConverter.
    impls:
      - args:
          - value: any1
            name: "struct"
          - value: string
            name: "name"
        return: any
