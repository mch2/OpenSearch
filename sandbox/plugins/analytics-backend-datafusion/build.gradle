opensearchplugin {
  description = 'DataFusion native execution engine plugin for the query engine.'
  classname = 'org.opensearch.be.datafusion.DataFusionPlugin'
  extendedPlugins = ['analytics-engine']
}

// Guava comes transitively from calcite-core — forbidden on compile classpaths by OpenSearch.
// Bypass via a custom config, same pattern as analytics-engine.
configurations {
  calciteCompile
  compileClasspath { exclude group: 'com.google.guava' }
}
sourceSets.main.compileClasspath += configurations.calciteCompile

dependencies {
  // Shared types and SPI interfaces (EngineBridge, AnalyticsSearchBackendPlugin, etc.)
  // Provided at runtime by the parent analytics-engine plugin (extendedPlugins).
  compileOnly project(':sandbox:libs:analytics-framework')

  // Guava for compile — Calcite class files reference ImmutableList at the class-file level
  calciteCompile "com.google.guava:guava:${versions.guava}"

  // Substrait — only new jars we bundle
  implementation('io.substrait:core:0.67.0') { transitive = false }
  implementation('io.substrait:isthmus:0.67.0') { transitive = false }

  compileOnly "org.apache.logging.log4j:log4j-api:${versions.log4j}"
  compileOnly "org.apache.logging.log4j:log4j-core:${versions.log4j}"
}

// TODO: Remove once back-end is built out with test suite
testingConventions.enabled = false
